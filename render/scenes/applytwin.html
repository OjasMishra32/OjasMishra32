<!doctype html><html><head><meta charset="utf-8"></head><body><div id="stage"></div>
<script type="module">
import { THREE, W, H, C, theme, makeRenderer, floorDisc, lights, css, sideTitle } from './common.js';
css(); sideTitle('ApplyTwin', 'One resume per posting,<br>tailored and applied for you.');
const renderer = makeRenderer();
const scene = new THREE.Scene(); scene.background = new THREE.Color(C.bg);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);
cam.setViewOffset(W, H, -W * 0.19, 0, W, H);
lights(scene); scene.add(floorDisc(2.0));

const paper = theme === 'dark' ? '#e8edf2' : '#ffffff';
function sheetTex(tailored) {
  const cv = document.createElement('canvas'); cv.width = 424; cv.height = 600;
  const g = cv.getContext('2d');
  g.fillStyle = paper; g.fillRect(0, 0, 424, 600);
  g.fillStyle = '#1f2328'; g.fillRect(36, 40, 190, 20);           // name
  g.fillStyle = '#8b949e'; g.fillRect(36, 72, 260, 8);
  let y = 112;
  const rnd = (i) => (Math.sin(i * 91.7) * 0.5 + 0.5);
  for (let sec = 0; sec < 4; sec++) {
    g.fillStyle = '#30363d'; g.fillRect(36, y, 110, 11); y += 26;
    for (let l = 0; l < 4; l++) {
      const hit = tailored && ((sec * 4 + l) % 3 === 1);
      g.fillStyle = hit ? C.accent : '#b7bec7';
      g.fillRect(48, y, 300 * (0.6 + 0.4 * rnd(sec * 7 + l)), 8); y += 19;
    }
    y += 14;
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const texA = sheetTex(false), texB = sheetTex(true);
const SW = 0.42, SH = 0.594;
const geo = new THREE.BoxGeometry(SW, SH, 0.003);
const mk = (tex) => {
  const front = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75 });
  const edge = new THREE.MeshStandardMaterial({ color: paper, roughness: 0.8 });
  const m = new THREE.Mesh(geo, [edge, edge, edge, edge, front, edge]); m.castShadow = true; m.receiveShadow = true; return m;
};
// static piles: postings in on the left, sent on the right
const L = new THREE.Vector3(-0.55, 0, 0.05), R = new THREE.Vector3(0.62, 0, -0.05);
for (let i = 0; i < 7; i++) {
  const a = mk(texA); a.rotation.set(-Math.PI / 2, 0, 0.18 * Math.sin(i * 2.1)); a.position.set(L.x, 0.004 + i * 0.006, L.z); scene.add(a);
  const b = mk(texB); b.rotation.set(-Math.PI / 2, 0, -0.12 + 0.15 * Math.sin(i * 1.7)); b.position.set(R.x, 0.004 + i * 0.006, R.z); scene.add(b);
}
const N = 6, movers = [];
for (let k = 0; k < N; k++) { const a = mk(texA), b = mk(texB); scene.add(a, b); movers.push([a, b]); }
const scanner = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.0035, 8, 160), new THREE.MeshBasicMaterial({ color: C.accent, toneMapped: false }));
scanner.position.set(0.03, 0.44, 0); scanner.rotation.y = Math.PI / 2 * 0.0; scene.add(scanner);
const bez = (a, b, c, d, s) => { const u = 1 - s; return a.clone().multiplyScalar(u*u*u).add(b.clone().multiplyScalar(3*u*u*s)).add(c.clone().multiplyScalar(3*u*s*s)).add(d.clone().multiplyScalar(s*s*s)); };
const P0 = new THREE.Vector3(L.x, 0.05, L.z), P1 = new THREE.Vector3(-0.5, 0.6, 0.1), P2 = new THREE.Vector3(0.55, 0.6, 0.0), P3 = new THREE.Vector3(R.x, 0.05, R.z);
const ease = (s) => s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2;
window.draw = (t) => {
  movers.forEach(([a, b], k) => {
    const s0 = (t + k / N) % 1;
    const s = ease(s0);
    const p = bez(P0, P1, P2, P3, s);
    const up = Math.sin(Math.PI * s);                       // 0 flat, 1 upright facing the camera
    const rx = -Math.PI / 2 + up * (Math.PI / 2 - 0.12);
    const ry = 0.55 * up - 0.25 * (s - 0.5);
    for (const m of [a, b]) { m.position.copy(p); m.rotation.set(rx, ry, 0.15 * (1 - up) * Math.sin(k)); }
    const tailored = s > 0.5;
    a.visible = !tailored; b.visible = tailored;
  });
  scanner.material.opacity = 1;
  scanner.rotation.set(0, 0.55, 0);
  cam.position.set(0.35, 1.2, 2.85); cam.lookAt(0.05, 0.3, 0);
  renderer.render(scene, cam);
};
window.ready = Promise.resolve();
</script></body></html>
